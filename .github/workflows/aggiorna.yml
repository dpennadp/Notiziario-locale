name: Aggiorna Notiziario Ogni Ora

on:
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install feedparser edge-tts
      - run: python genera_notiziario.py
      - run: |
          git config user.name "Bot"
          git config user.email "bot@://github.com"
          git add notiziario.mp3
          git commit -m "Audio" || exit 0
          git push

